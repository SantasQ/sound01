<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play Audio</title>
</head>
<body style="text-align: center; padding-top: 100px; background-color: #f0f0f0;">
  <h2>Click the button to start looped playback</h2>
  <button onclick="document.getElementById('loopAudio').play()">Play Music</button>
  <audio id="loopAudio" loop>
    <source src="sound.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</body>
</html>
