<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f9f5e1;
      overflow: hidden;
    }
    #controls {
      position: absolute;
      top: 5px;
      left: 5px;
      z-index: 1000;
    }
    button {
      padding: 2px 6px;
      font-size: 10px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button onclick="document.getElementById('audio').play()">▶</button>
    <button onclick="document.getElementById('audio').pause()">⏸</button>
  </div>
  <audio id="audio" loop>
    <source src="sound.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</body>
</html>
